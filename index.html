<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir UMKM Mobile</title>
  <script src="css/tailwind.min.css"></script>
  <script src="js/html5-qrcode.min.js"></script>
  <style>
    /* Styling khusus agar nyaman di layar sentuh Android */
    .touch-btn { touch-action: manipulation; min-height: 44px; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased pb-12">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">Kasir UMKM</h1>
      <span class="text-xs bg-blue-800 px-2.5 py-1 rounded-full text-blue-100">Offline App</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-3 space-y-4">

    <!-- Scanner Barcode Section -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-base font-semibold text-gray-700 mb-2 flex items-center gap-2">
        <span>📷</span> Scan Barcode Produk
      </h2>
      <div id="reader" class="w-full bg-gray-50 rounded-lg overflow-hidden border border-dashed border-gray-300"></div>
      <div class="mt-3 flex gap-2">
        <button id="btn-start-scan" onclick="startScanner()" class="touch-btn flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2 px-3 rounded-lg text-sm text-center">
          Mulai Kamera
        </button>
        <button id="btn-stop-scan" onclick="stopScanner()" class="touch-btn hidden flex-1 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-medium py-2 px-3 rounded-lg text-sm text-center">
          Tutup Kamera
        </button>
      </div>
    </section>

    <!-- Form Input / Pencarian Manual -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-base font-semibold text-gray-700 mb-2 flex items-center gap-2">
        <span>🔍</span> Cari / Tambah Barang
      </h2>
      <form id="form-transaksi" onsubmit="tambahBarangManual(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Kode / Nama Barang</label>
          <input type="text" id="input-barang" required placeholder="Ketik kode atau nama..." class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Harga (Rp)</label>
            <input type="number" id="input-harga" required placeholder="0" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Jumlah</label>
            <input type="number" id="input-qty" value="1" min="1" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>
        <button type="submit" class="touch-btn w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium py-2.5 rounded-lg text-sm shadow">
          + Tambah ke Keranjang
        </button>
      </form>
    </section>

    <!-- Daftar Keranjang Belanja -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-semibold text-gray-700 flex items-center gap-2">
          <span>🛒</span> Keranjang Belanja
        </h2>
        <button onclick="kosongkanKeranjang()" class="text-xs text-red-600 hover:underline">Hapus Semua</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="border-b bg-gray-50 text-gray-600">
              <th class="py-2 px-1">Item</th>
              <th class="py-2 px-1 text-center">Qty</th>
              <th class="py-2 px-1 text-right">Subtotal</th>
              <th class="py-2 px-1 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-keranjang" class="divide-y divide-gray-100">
            <!-- Data keranjang dimasukkan via JS -->
          </tbody>
        </table>
      </div>

      <!-- Ringkasan Pembayaran -->
      <div class="mt-4 pt-3 border-t border-gray-200 space-y-2">
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-600">Total Belanja:</span>
          <span id="text-total" class="font-bold text-lg text-blue-600">Rp 0</span>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Uang Diterima (Rp)</label>
          <input type="number" id="input-bayar" oninput="hitungKembalian()" placeholder="0" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div class="flex justify-between items-center text-sm pt-1">
          <span class="text-gray-600">Kembalian:</span>
          <span id="text-kembali" class="font-semibold text-gray-800">Rp 0</span>
        </div>

        <button onclick="selesaikanTransaksi()" class="touch-btn w-full mt-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-lg text-sm shadow-md">
          Selesaikan Transaksi
        </button>
      </div>
    </section>

  </main>

  <script>
    let keranjang = JSON.parse(localStorage.getItem('kasir_keranjang')) || [];
    let html5QrcodeScanner = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderKeranjang();
    });

    function simpanKeStorage() {
      localStorage.setItem('kasir_keranjang', JSON.stringify(keranjang));
    }

    function formatRupiah(angka) {
      return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    function tambahBarangManual(e) {
      e.preventDefault();
      const nama = document.getElementById('input-barang').value.trim();
      const harga = parseFloat(document.getElementById('input-harga').value);
      const qty = parseInt(document.getElementById('input-qty').value);

      if (!nama || isNaN(harga) || isNaN(qty)) return;

      tambahItem(nama, harga, qty);
      document.getElementById('form-transaksi').reset();
      document.getElementById('input-qty').value = 1;
    }

    function tambahItem(nama, harga, qty) {
      const index = keranjang.findIndex(item => item.nama.toLowerCase() === nama.toLowerCase());
      if (index > -1) {
        keranjang[index].qty += qty;
      } else {
        keranjang.push({ id: Date.now(), nama, harga, qty });
      }
      simpanKeStorage();
      renderKeranjang();
    }

    function hapusItem(id) {
      keranjang = keranjang.filter(item => item.id !== id);
      simpanKeStorage();
      renderKeranjang();
    }

    function kosongkanKeranjang() {
      if (keranjang.length === 0) return;
      if (confirm('Kosongkan keranjang belanja?')) {
        keranjang = [];
        simpanKeStorage();
        renderKeranjang();
      }
    }

    function renderKeranjang() {
      const tbody = document.getElementById('tabel-keranjang');
      tbody.innerHTML = '';

      let total = 0;

      if (keranjang.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-400">Keranjang kosong</td></tr>`;
      } else {
        keranjang.forEach(item => {
          const subtotal = item.harga * item.qty;
          total += subtotal;

          const tr = document.createElement('tr');
          tr.className = 'hover:bg-gray-50';
          tr.innerHTML = `
            <td class="py-2 px-1 font-medium text-gray-800">${item.nama}<br><span class="text-gray-400 text-[10px]">${formatRupiah(item.harga)}</span></td>
            <td class="py-2 px-1 text-center">${item.qty}</td>
            <td class="py-2 px-1 text-right font-medium">${formatRupiah(subtotal)}</td>
            <td class="py-2 px-1 text-center">
              <button onclick="hapusItem(${item.id})" class="text-red-500 hover:text-red-700 font-bold p-1">✕</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('text-total').innerText = formatRupiah(total);
      hitungKembalian();
    }

    function hitungKembalian() {
      const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const bayar = parseFloat(document.getElementById('input-bayar').value) || 0;
      const kembali = bayar - total;

      const textKembali = document.getElementById('text-kembali');
      if (kembali < 0) {
        textKembali.innerText = 'Uang Kurang';
        textKembali.className = 'font-semibold text-red-500';
      } else {
        textKembali.innerText = formatRupiah(kembali);
        textKembali.className = 'font-semibold text-emerald-600';
      }
    }

    function selesaikanTransaksi() {
      const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const bayar = parseFloat(document.getElementById('input-bayar').value) || 0;

      if (keranjang.length === 0) {
        alert('Keranjang masih kosong!');
        return;
      }

      if (bayar < total) {
        alert('Jumlah pembayaran masih kurang!');
        return;
      }

      const kembali = bayar - total;
      alert(`Transaksi Berhasil!\nTotal: ${formatRupiah(total)}\nBayar: ${formatRupiah(bayar)}\nKembali: ${formatRupiah(kembali)}`);

      // Reset transaksi
      keranjang = [];
      simpanKeStorage();
      document.getElementById('input-bayar').value = '';
      renderKeranjang();
    }

    // --- FUNGSI SCANNER BARCODE ---
    function startScanner() {
      document.getElementById('btn-start-scan').classList.add('hidden');
      document.getElementById('btn-stop-scan').classList.remove('hidden');

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 150 } },
        (decodedText) => {
          // Ketika barcode terdeteksi
          tambahItem(decodedText, 10000, 1); // Default harga Rp 10.000 jika belum terdaftar
          stopScanner();
        },
        (errorMessage) => {
          // Abaikan error saat memindai frame
        }
      ).catch(err => {
        alert("Gagal membuka kamera: " + err);
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('btn-start-scan').classList.remove('hidden');
          document.getElementById('btn-stop-scan').classList.add('hidden');
        }).catch(err => console.error(err));
      }
    }
  </script>
</body>
</html>
